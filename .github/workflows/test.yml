# 自動測試：語法檢查 + Playwright 端到端功能測試
#
# 觸發：push 到 main、pull_request 到 main、手動 workflow_dispatch。
# 不需要任何 secret。語法檢查先跑，通過後才跑 E2E。
name: Test (syntax + E2E)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check worker.js syntax
        run: node --check worker.js

      - name: Check inline scripts in public/index.html
        # 把 inline <script> 抽出來逐一做 node --check（只做語法解析，不執行）
        run: node scripts/check-inline-scripts.mjs

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start wrangler dev (background)
        run: |
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          echo $! > wrangler-dev.pid

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/ > /dev/null 2>&1; then
              echo "wrangler dev is ready"
              exit 0
            fi
            sleep 3
          done
          echo "wrangler dev did not become ready in 180s"
          cat wrangler-dev.log || true
          exit 1

      - name: Smoke check (real worker endpoints)
        # 首頁回 200 且含標題；/api/fx 回合法 JSON 且含 rates 欄位
        run: |
          curl -sf http://127.0.0.1:8787/ | grep -q '<title>個人資產總帳</title>'
          curl -s 'http://127.0.0.1:8787/api/fx?currencies=USD' | node -e "
            let s = '';
            process.stdin.on('data', (d) => { s += d; }).on('end', () => {
              const j = JSON.parse(s);
              if (!('rates' in j)) { console.error('bad /api/fx response:', s); process.exit(1); }
              console.log('/api/fx ok, rates:', JSON.stringify(j.rates));
            });
          "

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Show wrangler log on failure
        if: failure()
        run: cat wrangler-dev.log || true
