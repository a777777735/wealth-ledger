name: Build Android & iOS App (Capacitor)

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Also build iOS Xcode bundle (macOS runner)'
        required: false
        default: 'true'
        type: boolean
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'capacitor.config.json'
      - 'package.json'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply App Launcher Icons
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp public/icons/icon-512.png "$dir/ic_launcher.png" || true
              cp public/icons/icon-512.png "$dir/ic_launcher_round.png" || true
              cp public/icons/icon-512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealth-ledger-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Xcode Project (Unsigned)
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios == true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add and sync Capacitor iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Copy iOS App Icon
        run: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -d "$ICON_DIR" ]; then
            cp public/icons/icon-512.png "$ICON_DIR/AppIcon-512@2x.png" || true
          fi

      - name: Verify iOS Simulator Build (Unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

      - name: Package iOS Xcode Project Artifact
        run: |
          tar -czf wealth-ledger-ios-xcode.tar.gz ios/

      - name: Upload iOS Xcode Project artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealth-ledger-ios-xcode
          path: wealth-ledger-ios-xcode.tar.gz
          if-no-files-found: error
